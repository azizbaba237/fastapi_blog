{% extends "layout.html" %}

{% block content %}
  <!--
    User Posts Page
    Displays all posts written by a specific user.
    The user object is passed from the route handler.
  -->
  <h1 class="mb-4">Posts by {{ user.username }}</h1>

  <!-- Loop through each post and render it -->
  {% for post in posts %}
    <article class="content-section py-3 px-4 mb-4">
      <div class="d-flex align-items-start gap-4">
        <!-- Author avatar -->
        <img
          class="rounded-circle article-img flex-shrink-0"
          src="{{ post.author.image_path }}"
          alt="{{ post.author.username }}'s profile picture"
          width="64"
          height="64"
          loading="lazy"
        />

        <div class="flex-grow-1">
          <!-- Metadata: author name and date -->
          <div class="article-metadata mb-2">
            <a
              class="me-2"
              href="{{ url_for('user_posts', user_id=post.author.id) }}"
              >{{ post.author.username }}</a
            >
            <small class="text-body-secondary"
              >{{ post.date_posted.strftime("%B %d, %Y") }}</small
            >
          </div>

          <!-- Post title (linked to full post page) -->
          <h2>
            <a
              class="article-title"
              href="{{ url_for('post_page', post_id=post.id) }}"
              >{{ post.title }}</a
            >
          </h2>

          <!-- Post content (plain text, no HTML) -->
          <p class="article-content">{{ post.content }}</p>
        </div>
      </div>
    </article>

    <!-- Fallback when the user has no posts -->
  {% else %}
    <p class="text-body-secondary">No posts by this user yet.</p>
  {% endfor %}
{% endblock content %}
